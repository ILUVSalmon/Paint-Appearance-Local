name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Types match docs/openapi.json
        run: pnpm types:generate && git diff --exit-code src/api/types.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt && pip install --no-deps -e .
      - name: One migration head
        run: test "$(alembic heads | wc -l)" -eq 1
      - name: OpenAPI files match the code
        run: python scripts/emit_openapi.py && git diff --exit-code openapi.json ../docs/openapi.json
      # The database tests need a copy of the plant data, which CI does not
      # have; run them locally against a restored copy (README.md, "Run the tests").
      # The summary line reports them as "deselected".
      - name: Tests that need no database
        env:
          T01_DB: none
        run: python -m pytest tests -q -o addopts=""

  # The whole Compose stack, as a developer starts it from README.md.
  compose:
    runs-on: ubuntu-24.04
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v5
      - name: Settings from the example
        run: cp .env.example .env
      - name: Database (first start creates migrator, app_rw and the database)
        run: docker compose up -d --wait postgres
      - name: Build the image
        run: docker compose build api
      - name: Migrate the empty database
        # 0025 seeds standards for colours that only the real data has, so an
        # empty database stops at 0024 (the whole schema before it). With the
        # data restored, `alembic upgrade head` runs to the end (README.md).
        run: docker compose run --rm migrate alembic upgrade 0024
      - name: API (waits for its health check)
        run: docker compose up -d --wait api
      - name: The site and the API answer
        run: |
          set -e
          curl -fsS http://127.0.0.1:8000/health/ready
          curl -fsS http://127.0.0.1:8000/api/v1/auth/me | grep -q '"open-access"'
          curl -fsS http://127.0.0.1:8000/ | grep -qi '<div id="root"'
          curl -fsS http://127.0.0.1:8000/plant/SAP | grep -qi '<div id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/api/v1/nope)" = 404
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
